# a summary about you
summary: 'Software Engineer with over 5 years of experience in Fullstack Development, DevOps, and System Design & Architecture. Registered with the Engineers Association of Ravenna Province (n. 2467). Currently Freelance Software Engineer with a focus on DevOps methodologies, event-based architecture design, and training/leading development teams, all aimed at improving Developer Experience (DevEx). I am also a member of the Scientific Technical Committee of Operai dell''Arte APS, where I support students in research and scientific publications.'

