<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sara & Francesco - 25 Aprile 2026</title>
<meta property="og:title" content="Sara & Francesco - Il Viaggio Comincia Qui">
<meta property="og:description" content="Sei invitato al matrimonio di Sara Morini e Francesco Montelli - 25 Aprile 2026">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9a84c;--gold-glow:rgba(201,168,76,0.4);--green-dark:#1a4425;--green-seal:#1f5530;--green-ribbon:#6B9E50;--green-ribbon-light:#7BB560}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Cinzel',serif;touch-action:none;position:fixed;top:0;left:0}
body.pannable{overflow:visible;position:static;touch-action:pan-x pan-y}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#1a1510;
  background-image:radial-gradient(ellipse at 50% 30%,rgba(50,40,25,1) 0%,#1a1510 70%);
}

.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;bottom:0;width:2px;height:2px;background:var(--gold);border-radius:50%;opacity:0;animation:fp linear infinite;box-shadow:0 0 4px var(--gold-glow)}
@keyframes fp{0%{opacity:0;transform:translateY(0) scale(0)}10%{opacity:1}90%{opacity:.5}100%{opacity:0;transform:translateY(-110vh) scale(1)}}

.hint{
  position:fixed;bottom:5vh;left:50%;transform:translateX(-50%);
  color:var(--gold);font-family:'Cinzel Decorative',serif;
  font-size:clamp(.7rem,2vw,1rem);letter-spacing:.3em;text-transform:uppercase;
  opacity:0;animation:hp 2.5s ease-in-out infinite 1.5s;
  z-index:100;text-align:center;white-space:nowrap;
  transition:opacity .8s ease;text-shadow:0 0 15px var(--gold-glow);
}
.hint.hidden{animation:none;opacity:0!important}
@keyframes hp{0%,100%{opacity:0}50%{opacity:.9}}

.title-text{
  font-family:'Cinzel Decorative',serif;color:var(--gold);
  font-size:clamp(.9rem,3vw,1.4rem);letter-spacing:.5em;text-transform:uppercase;
  margin-bottom:2vh;opacity:0;animation:fi 2s ease forwards .5s;z-index:10;
  text-shadow:0 0 20px var(--gold-glow);
}
@keyframes fi{to{opacity:1}}

/* Card */
.card-scene{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  transform:scale(.95);
  transition:transform 2s cubic-bezier(.23,1,.32,1);
}
.card-scene.opened{transform:scale(.85)}

.center-panel{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  z-index:1;border-radius:4px;
}
.center-panel img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}

.glow{
  position:absolute;top:-15%;left:-15%;width:130%;height:130%;
  background:radial-gradient(ellipse at center,var(--gold-glow) 0%,transparent 60%);
  opacity:0;z-index:0;pointer-events:none;transition:opacity 2s ease .3s;
}
.card-scene.opened .glow{opacity:1}

/* Doors */
.door{
  position:absolute;top:0;
  width:100%;height:100%;
  z-index:20;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  transition:transform 2.2s cubic-bezier(.23,1,.32,1);
}
.door-left{left:0;transform-origin:left center;transform:rotateY(0deg)}
.door-right{left:0;transform-origin:right center;transform:rotateY(0deg)}
.card-scene.opened .door-left{transform:rotateY(-160deg)}
.card-scene.opened .door-right{transform:rotateY(160deg)}

.face{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face-front{z-index:0}
.door-left .face-back img{border-right:1px solid #382B224D}
.door-right .face-back img{border-left:1px solid #382B224D}
.face-back{z-index:1;transform:rotateY(180deg)}

/* Edge glow */
.edge-glow{
  position:absolute;top:0;right:0;
  width:4px;height:100%;z-index:25;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent 5%,var(--gold) 50%,transparent 95%);
  animation:eg 3s ease-in-out infinite 2s;
}
.card-scene.opened .edge-glow{animation:none;opacity:0!important}
@keyframes eg{0%,100%{opacity:0}50%{opacity:.6}}

.card-scene::after{
  content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;
  border-radius:6px;pointer-events:none;z-index:-1;
  box-shadow:0 0 40px rgba(0,0,0,.5),0 0 80px rgba(0,0,0,.3),0 20px 60px rgba(0,0,0,.4);
}

/* ===== RIBBON ===== */
.ribbon-half{
  position:absolute;top:0;
  width:10%;height:100%;
  pointer-events:none;z-index:5;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transition:opacity .3s ease;
}
.ribbon-half.hidden{opacity:0}
.door-left .ribbon-half{right:-2px}
.door-left .ribbon-half::before{
  content:'';position:absolute;top:0;right:0;
  width:100%;height:100%;
  background:linear-gradient(to right, 
    rgba(140,148,110,0.0) 0%, 
    rgba(150,158,118,0.7) 25%, 
    rgba(160,168,125,0.9) 50%,
    rgba(165,173,130,1) 100%);
}
.door-right .ribbon-half{left:-2px}
.door-right .ribbon-half::before{
  content:'';position:absolute;top:0;left:0;
  width:100%;height:100%;
  background:linear-gradient(to left, 
    rgba(140,148,110,0.0) 0%, 
    rgba(150,158,118,0.7) 25%, 
    rgba(160,168,125,0.9) 50%,
    rgba(165,173,130,1) 100%);
}

/* ===== WAX SEAL ===== */
.wax-seal{
  position:absolute;
  top:50%;left:50%;
  width:24%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  z-index:35;
  pointer-events:none;
}
.wax-seal.hidden{
  opacity:0;
  transform:translate(-50%,-50%) scale(1.2);
  transition:opacity .3s ease, transform .3s ease;
}
.wax-seal.visible{
  opacity:1;
  transform:translate(-50%,-50%);
  transition:opacity .4s ease, transform .4s ease;
}

.wax-body{
  width:100%;height:100%;
  border-radius:50%;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 38% 32%, #306b3d, #1f5530 40%, #174020 70%, #0f2d15 100%);
  box-shadow:
    0 3px 12px rgba(0,0,0,0.6),
    0 1px 4px rgba(0,0,0,0.4),
    inset 0 2px 4px rgba(255,255,255,0.12),
    inset 0 -3px 6px rgba(0,0,0,0.4),
    inset 2px 0 4px rgba(255,255,255,0.06);
}

/* Wax edge irregularity via multiple shadows */
.wax-body::before{
  content:'';position:absolute;
  inset:-4%;
  border-radius:48% 52% 50% 50% / 50% 48% 52% 50%;
  background:radial-gradient(ellipse at 38% 32%, #2a6035, #1a4a28 50%, #123318 100%);
  z-index:-1;
  box-shadow:
    2px 1px 0 rgba(15,45,21,0.6),
    -1px 2px 0 rgba(15,45,21,0.5),
    1px -1px 0 rgba(15,45,21,0.4);
}

/* Second irregular layer */
.wax-body::after{
  content:'';position:absolute;
  inset:-6%;
  border-radius:52% 48% 47% 53% / 48% 52% 48% 52%;
  background:radial-gradient(ellipse at 45% 40%, rgba(42,96,53,0.5), rgba(26,68,37,0.3) 60%, transparent 80%);
  z-index:-2;
}

.wax-body img{
  width:82%;height:auto;
  filter:drop-shadow(0 0 3px rgba(201,168,76,0.4)) brightness(1.1);
  opacity:0.85;
}

/* Shine highlight on wax */
.wax-shine{
  position:absolute;top:8%;left:15%;
  width:35%;height:25%;
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,255,255,0.12), transparent 70%);
  transform:rotate(-20deg);
  pointer-events:none;
}

/* Ribbon bow / knot behind seal */
.ribbon-bow{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:32%;height:6%;
  z-index:34;pointer-events:none;
}
.ribbon-bow.hidden{opacity:0;transition:opacity .3s ease}
.ribbon-bow.visible{opacity:1;transition:opacity .4s ease}

.ribbon-bow::before,.ribbon-bow::after{
  content:'';position:absolute;top:0;
  width:42%;height:100%;
  background:linear-gradient(to bottom, 
    rgba(140,148,110,0.3),
    rgba(155,163,122,0.9) 30%,
    rgba(165,173,130,1) 50%,
    rgba(155,163,122,0.9) 70%,
    rgba(140,148,110,0.3));
  border-radius:3px;
}
.ribbon-bow::before{left:6%;transform:rotate(-20deg)}
.ribbon-bow::after{right:6%;transform:rotate(20deg)}

/* ===== POCKET & BUSINESS CARD ===== */
.pocket-area{
  position:absolute;
  left:-32%;bottom:6.2%;
  width:53%;height:auto;
  z-index:2;
  pointer-events:none;
  opacity:0;
  transition:opacity .4s ease .2s;
}
.pocket-area.show{
  opacity:1;
  pointer-events:auto;
}

/* Pocket - actual image */
.pocket{
  position:absolute;bottom:25px;left:-1px;
  width:75%;
  z-index:2;
  pointer-events:none;
}
.pocket img{
  width:100%;height:auto;display:block;
}

/* Business card */
.biz-card{
  position:absolute;bottom:133px;right:33%;
  width:60%;aspect-ratio:2/3.2;
  transform:translateY(55%);
  clip-path:inset(0 0 15% 0);
  z-index:1;
  cursor:pointer;
  transition:transform .9s cubic-bezier(.25,.46,.45,.94), clip-path .9s cubic-bezier(.25,.46,.45,.94);
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
}
.biz-card.pulled{
  transform:translateY(-33%);
  clip-path:inset(0 0 0 0);
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
}

.biz-face{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  background:#e8ddc7;
  border-radius:4px;
  box-shadow:0 2px 8px rgba(0,0,0,0.3), 0 0 1px rgba(0,0,0,0.2);
  border:1px solid var(--green-dark);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:8%;
  font-family:'Cinzel',serif;
  color:#3d3225;
  justify-content: space-evenly;
}
.biz-front{z-index:1}
.biz-back{
  transform:rotateY(180deg);
}

.biz-face .biz-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(0.42rem,1.5vw,0.72rem);
  color:#1a2010;
  letter-spacing:.13em;
  text-transform:uppercase;
  margin-bottom:6%;
  text-align:center;
}
.biz-face .biz-main{
  font-size:clamp(0.38rem,1.25vw,0.62rem);
  line-height:1.35;
  text-align:center;
  color:#000000;
}
.biz-face .biz-main a{
  color:#1a2010;
  text-decoration:none;
}
.biz-face .biz-main .biz-code{
  font-weight:600;
  letter-spacing:.08em;
  display:block;
  margin:4% 0;
  font-size:clamp(0.4rem,1.35vw,0.65rem);
}
.biz-face .biz-small{
  font-size:clamp(0.28rem,0.9vw,0.46rem);
  color:#1a1510;
  margin-top:4%;
  text-align:center;
  line-height:1.5;
}
.biz-face .biz-agency{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(0.35rem,1.1vw,0.55rem);
  color:#000000;
  margin-bottom:6%;
  letter-spacing:.1em;
}
.biz-face .biz-quote{
  font-style:italic;
  font-size:clamp(0.35rem,1.1vw,0.55rem);
  color:#1a1510;
  margin-bottom:6%;
  text-align:center;
}

/* Pull hint arrow */
.pull-hint{
  position:absolute;bottom:12%;left:-18%;
  font-size:clamp(2rem,7vw,3.5rem);
  color:var(--gold);
  opacity:0;
  pointer-events:none;
  z-index:40;
  text-shadow:0 0 8px var(--gold-glow),0 0 16px var(--gold-glow);
  transition:opacity .4s ease;
}
.pull-hint.visible{opacity:1;animation:pullhint 1.5s ease-in-out infinite}
@keyframes pullhint{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
</style>
</head>
